<pre><b><p class ="Aufgabe">Aufgabe 30

x<sup>2</sup> - 10x + 32 = 0    

p = -10 ; q = 32

x<sub>1,2</sub> = <math mathsize="1em"><mfrac><mrow><mo>&#x2212;</mo><mfenced><mrow><mo>&#x2212;</mo><mn>10</mn></mrow></mfenced></mrow><mn>2</mn></mfrac><mo>&#xb1;</mo><msqrt><mrow><msup><mfenced><mfrac><mrow><mo>&#x2212;</mo><mn>10</mn></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>&#x2212;</mo><mn>32</mn></mrow></msqrt></math>

x<sub>1,2</sub> = 5 ± <math mathsize="0.9em"><msqrt><mrow><mn>25</mn><mo>&#x2212;</mo><mn>32</mn></mrow></msqrt></math>

Die Diskriminante (der Wert unter der Wurzel) 
ist negativ. (25 - 32 = -7).
Die Gleichung hat deswegen 
<span style="color:red;">keine reelle Lösung.</span>
