<pre><b><p class ="Aufgabe">Aufgabe 16

x<sup>2</sup> + 2x = 63         

x<sup>2</sup> + 2x = 63 | -63

x<sup>2</sup> + 2x - 63 = 0

p = 2 ; q = -63

x<sub>1,2</sub> = <math xmlns="http://www.w3.org/1998/Math/MathML"><mfrac><mrow><mo>&#x2212;</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>&#xb1;</mo><msqrt><mrow><msup><mfenced><mfrac><mn>2</mn><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>&#x2212;</mo><mfenced><mrow><mo>-</mo><mn>63</mn></mrow></mfenced></mrow></msqrt></math>   

x<sub>1,2</sub> = -1 ± <math xmlns="http://www.w3.org/1998/Math/MathML"><msqrt><mrow><mn>1</mn><mo>+</mo><mn>63</mn></mrow></msqrt></math>  

x<sub>1,2</sub> = -1 ± <math xmlns="http://www.w3.org/1998/Math/MathML"><msqrt><mn>64</mn></msqrt></math>  

x<sub>1,2</sub> = -1 ± 8

<span style="color:red;">x<sub>1</sub></span> = - 1 - 8 <span style="color:red;">= -9</span>

<span style="color:red;">x<sub>2</sub></span> = - 1 + 8 <span style="color:red;">= 7</span>


</p></b></pre>
