<pre><b><p class ="Aufgabe">Aufgabe 22

x<sup>2</sup> - 40x + 111 = 0    

p = -40 ; q = 111

x<sub>1,2</sub> = <math mathsize="1em"><mfrac><mrow><mo>&#x2212;</mo><mfenced><mrow><mo>-</mo><mn>40</mn></mrow></mfenced></mrow><mn>2</mn></mfrac><mo>&#xb1;</mo><msqrt><mrow><msup><mfenced><mfrac><mrow><mo>-</mo><mn>40</mn></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>&#x2212;</mo><mn>111</mn></mrow></msqrt></math>

x<sub>1,2</sub> = 20 ± <math mathsize="0.9em"><msqrt><mrow><mn>400</mn><mo>&#x2212;</mo><mn>111</mn></mrow></msqrt></math>  

x<sub>1,2</sub> = 20 ± <math mathsize="0.9em"><msqrt><mn>289</mn></msqrt></math>  

x<sub>1,2</sub> = 20 ± 17

<span style="color:red;">x<sub>1</sub></span> = 20 - 17 <span style="color:red;">= 3</span>

<span style="color:red;">x<sub>2</sub></span> = 20 + 17 <span style="color:red;">= 37</span>

</p></b></pre>
