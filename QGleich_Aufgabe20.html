<pre><b><p class ="Aufgabe">Aufgabe 20

x<sup>2</sup> + 6x = 91          

x<sup>2</sup> + 6x = 91 | -91

x<sup>2</sup> + 6x - 91 = 0

p = 6 ; q = -91

x<sub>1,2</sub> = <math mathsize="1em"><mfrac><mrow><mo>-</mo><mn>6</mn></mrow><mn>2</mn></mfrac><mo>&#xb1;</mo><msqrt><mrow><msup><mfenced><mfrac><mn>6</mn><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>&#x2212;</mo><mfenced><mrow><mo>&#x2212;</mo><mn>91</mn></mrow></mfenced></mrow></msqrt></math>

x<sub>1,2</sub> = -3 ± <math mathsize="0.9em"><msqrt><mrow><mn>9</mn><mo>+</mo><mn>91</mn></mrow></msqrt></math>  

x<sub>1,2</sub> = -3 ± <math mathsize="0.9em"><msqrt><mn>100</mn></msqrt></math>  

x<sub>1,2</sub> = -3 ± 10

<span style="color:red;">x<sub>1</sub></span> = -3 - 10 <span style="color:red;">= -13</span>

<span style="color:red;">x<sub>2</sub></span> = -3 + 10 <span style="color:red;">= 7</span>

</p></b></pre>
